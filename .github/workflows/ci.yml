name: ci

# Continuous integration: the same chain a developer runs locally, on a clean
# machine. If this passes, `python scripts/verify.py` passes on a fresh clone.
#
# Author: 晨星

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install pinned core and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: P0 gate - no pictographic characters
        run: python tools/scan_emoji.py .

      - name: Unit and integration tests
        run: python -m pytest tests -v

      - name: End-to-end (starts the real server)
        run: python scripts/e2e.py

      - name: Full verification chain
        run: python scripts/verify.py

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-report-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            verify_report.json
            verify_e2e.json
            verify_e2e_server.log
          if-no-files-found: warn
          retention-days: 14

  docker:
    name: docker build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t atlas-ai-stack:ci .

      - name: Start container
        run: docker run -d --name atlas-ci -p 127.0.0.1:8077:8077 atlas-ai-stack:ci

      - name: Wait for health, then assert the scorecard
        run: |
          python - <<'PY'
          import json, sys, time, urllib.request

          def get(path, payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(
                  f"http://127.0.0.1:8077{path}", data=data,
                  headers={"Content-Type": "application/json"},
              )
              with urllib.request.urlopen(req, timeout=10) as response:
                  return json.load(response)

          deadline = time.time() + 60
          while time.time() < deadline:
              try:
                  if get("/health")["chunks"] > 0:
                      break
              except Exception:
                  time.sleep(1)
          else:
              sys.exit("container never became healthy")

          report = get("/v1/eval", {"include_cases": False})
          print(json.dumps(report, indent=1))
          assert report["route_accuracy"] == 1.0, report
          assert report["doc_hit_rate"] >= 0.95, report
          assert report["grounding_rate"] >= 0.95, report
          print("container scorecard OK")
          PY

      - name: Container logs on failure
        if: failure()
        run: docker logs atlas-ci

      - name: Stop container
        if: always()
        run: docker rm -f atlas-ci || true
